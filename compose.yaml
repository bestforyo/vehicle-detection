services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a unique POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    security_opt:
      - no-new-privileges:true

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: 3001
      HOST: 0.0.0.0
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL to the private postgres service in .env}
      S3_ENDPOINT: ${S3_ENDPOINT:?Set an S3-compatible private object-store endpoint in .env}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${API_PORT:-3001}:3001"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3001/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  migrate:
    profiles: ["maintenance"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: build
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL to the private postgres service in .env}
    depends_on:
      postgres:
        condition: service_healthy
    command: ["npm", "run", "db:migrate:deploy", "--workspace", "@jianjian/api"]
    restart: "no"

  seed:
    profiles: ["maintenance"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: build
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL to the private postgres service in .env}
      PLATFORM_BOOTSTRAP_EMAIL: ${PLATFORM_BOOTSTRAP_EMAIL:-}
      PLATFORM_BOOTSTRAP_PASSWORD: ${PLATFORM_BOOTSTRAP_PASSWORD:-}
      PLATFORM_BOOTSTRAP_NAME: ${PLATFORM_BOOTSTRAP_NAME:-}
    depends_on:
      postgres:
        condition: service_healthy
    command: ["npm", "run", "db:seed", "--workspace", "@jianjian/api"]
    restart: "no"

  minio:
    profiles: ["local-storage"]
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio-local-user}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-replace-this-minio-password}
    volumes:
      - minio-data:/data
    ports:
      - "127.0.0.1:${MINIO_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    security_opt:
      - no-new-privileges:true

  minio-init:
    profiles: ["local-storage"]
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio-local-user}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-replace-this-minio-password}
      S3_BUCKET: ${S3_BUCKET:-jianjian-private}
    entrypoint:
      - /bin/sh
      - -c
      - >
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" &&
        attempt=0 &&
        until mc ready local; do
          attempt=$$((attempt + 1));
          if [ "$$attempt" -ge 30 ]; then echo "MinIO did not become ready." >&2; exit 1; fi;
          sleep 2;
        done &&
        mc mb --ignore-existing "local/$$S3_BUCKET" &&
        mc anonymous set none "local/$$S3_BUCKET"
    restart: "no"

volumes:
  postgres-data:
  minio-data:
